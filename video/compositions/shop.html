  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const COST = "#e07a5f";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num" || role === "gold") return NUM;
        if (role === "cost") return COST;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.42, Math.max(0.18, (dur - 0.35) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.06 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.14, immediateRender: false }, t + each * 0.7);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.08, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.12, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      const cap = (id, start, dur, last) => {
        if (start > 0) {
          tl.set(id, { opacity: 0 }, 0);
          tl.to(id, { opacity: 1, duration: 0.16 }, start);
        }
        karaoke(id, start, Math.max(0.8, dur - 0.28));
        if (!last) tl.to(id, { opacity: 0, duration: 0.14 }, start + dur - 0.14);
      };
      tl.set("#arm", { rotation: -24, transformOrigin: "0% 50%" }, 0);
      Array.from(document.querySelectorAll(".steam")).forEach((el, i) => {
        const half = 1.25 + i * 0.18;
        const slots = Math.floor(64 / half);
        tl.fromTo(el, { y: 8, opacity: 0.12 }, { y: -26, opacity: 0.4, duration: half, ease: "sine.inOut", yoyo: true, repeat: slots - 1 }, i * 0.15);
      });
      tl.to("#stream", { scaleY: 0, duration: 0.7, ease: "power2.in" }, 2.1);
      tl.to("#speech", { opacity: 1, duration: 0.18 }, 6.05);
      tl.to("#speech", { opacity: 0, duration: 0.14 }, 10.7);
      tl.to("#tea", { backgroundColor: "#e07a5f", duration: 0.28 }, 11.15);
      tl.to("#fill", { scaleY: 1.16, duration: 0.28, ease: "power2.out" }, 11.15);
      tl.to("#pile", { opacity: 1, duration: 0.2 }, 11.2);
      tl.to("#speech2", { opacity: 1, duration: 0.18 }, 16.1);
      tl.to("#speech2", { opacity: 0, duration: 0.16 }, 19.6);
      tl.to("#pile", { y: -6, duration: 0.2, yoyo: true, repeat: 1 }, 21.3);
      tl.to("#people", { x: -12, duration: 0.3, ease: "power2.out" }, 27.3);
      tl.fromTo("#sheet", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 33.2);
      tl.to("#hop", { opacity: 1, duration: 0.12 }, 38.9);
      tl.to("#hop", { x: 16, y: -8, duration: 0.18, ease: "power3.out" }, 39.2);
      tl.fromTo("#book", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.22 }, 44.2);
      tl.to("#book-page", { x: 16, duration: 0.18, ease: "power2.out" }, 46.5);
      tl.to("#book", { x: 460, opacity: 0, duration: 0.36, ease: "power2.in" }, 48.3);
      tl.fromTo("#sticker", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 50.15);
      tl.to("#hop", { x: 250, y: -90, duration: 0.18, ease: "power3.out" }, 50.45);
      tl.fromTo("#spoon", { opacity: 0, x: 40, rotation: -28 }, { opacity: 1, x: 0, rotation: 18, duration: 0.32, ease: "power2.out" }, 55.2);
      tl.to("#people", { x: -340, opacity: 0, duration: 0.5, ease: "power2.in" }, 60.25);
      tl.to("#spoon", { opacity: 0.4, duration: 0.3 }, 62.2);
      cap("#c1", 0, 6, false);
      cap("#c2", 6, 5, false);
      cap("#c3", 11, 5, false);
      cap("#c4", 16, 5, false);
      cap("#c5", 21, 6, false);
      cap("#c6", 27, 6, false);
      cap("#c7", 33, 6, false);
      cap("#c8", 39, 5, false);
      cap("#c9", 44, 6, false);
      cap("#c10", 50, 5, false);
      cap("#c11", 55, 5, false);
      cap("#c12", 60, 6, true);
      window.__timelines = window.__timelines || {};
      window.__timelines["shop"] = tl;
    })();
  </script>
