<template>
  <style>
    @font-face {
      font-family: "Be Vietnam Pro";
      src: url("assets/fonts/BeVietnamPro-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0c0f14;
      color: #f4f1ea;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 700;
    }
    .field { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .mote { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #e7c56a; opacity: 0.28; }
    .mote.alt { width: 5px; height: 5px; background: #7dcec4; opacity: 0.22; }
    #follow-ring {
      position: absolute;
      left: 330px;
      top: 430px;
      z-index: 1;
      width: 420px;
      height: 420px;
      border: 3px solid #e7c56a;
      border-radius: 50%;
      opacity: 0.28;
    }
    .line {
      position: absolute;
      left: 72px;
      z-index: 3;
      width: 936px;
      margin: 0;
      font-size: 52px;
      line-height: 1.25;
    }
    #follow-1 { top: 500px; }
    #follow-name { top: 590px; font-size: 64px; opacity: 0; }
    #follow-3 { top: 760px; font-size: 40px; line-height: 1.35; opacity: 0; }
    #follow-rule {
      position: absolute;
      left: 72px;
      top: 700px;
      z-index: 3;
      width: 280px;
      height: 6px;
      border-radius: 3px;
      background: #e7c56a;
      transform-origin: 0% 50%;
    }
    .w { color: #9a9388; }
    .w.hot { color: #7dcec4; }
  </style>
  <div id="root" data-composition-id="follow" data-width="1080" data-height="1920" data-layout-allow-overlap>
    <div id="follow-field" class="field">
      <i class="mote" style="left:24px;top:120px"></i>
      <i class="mote alt" style="left:18px;top:640px"></i>
      <i class="mote" style="left:30px;top:1100px"></i>
      <i class="mote alt" style="left:22px;top:1560px"></i>
      <i class="mote" style="left:200px;top:48px"></i>
      <i class="mote alt" style="left:700px;top:40px"></i>
      <i class="mote" style="left:1040px;top:200px"></i>
      <i class="mote alt" style="left:1034px;top:700px"></i>
      <i class="mote" style="left:1046px;top:1180px"></i>
      <i class="mote alt" style="left:900px;top:1700px"></i>
      <i class="mote" style="left:420px;top:1760px"></i>
      <i class="mote alt" style="left:160px;top:1688px"></i>
    </div>
    <div id="follow-ring"></div>
    <p id="follow-1" class="line"><span class="w hot">Hãy</span> <span class="w">Follow</span></p>
    <p id="follow-name" class="line"><span class="w" data-role="gold">Anh</span> <span class="w" data-role="gold">40</span> <span class="w" data-role="gold">học</span> <span class="w" data-role="gold">AI</span></p>
    <div id="follow-rule"></div>
    <p id="follow-3" class="line"><span class="w">để</span> <span class="w">cập</span> <span class="w">nhật</span> <span class="w">nhiều</span> <span class="w">thông</span> <span class="w">tin</span> <span class="w">về</span> <span class="w">AI</span> <span class="w">hơn.</span></p>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num" || role === "gold") return NUM;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.42, Math.max(0.22, (dur - 0.2) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + i * each;
          if (i === 0 && !stay) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.16, immediateRender: false }, t + each * 0.8);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.1, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.14, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      Array.from(document.querySelectorAll("#follow-field .mote")).forEach((el, i) => {
        const half = 1.5 + (i % 3) * 0.2;
        const slots = Math.floor(5.6 / half);
        if (slots < 2) return;
        tl.to(el, { y: (i % 2 ? 1 : -1) * (16 + (i % 3) * 6), duration: half, ease: "sine.inOut", yoyo: true, repeat: slots - 1 }, 0);
      });
      tl.to("#follow-ring", { rotation: 12, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.15);
      karaoke("#follow-1", 0.1, 1.1);
      tl.set("#follow-name", { opacity: 0 }, 0);
      tl.to("#follow-name", { opacity: 1, duration: 0.22 }, 1.05);
      karaoke("#follow-name", 1.1, 1.7);
      tl.set("#follow-rule", { scaleX: 0 }, 0);
      tl.to("#follow-rule", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.2);
      tl.set("#follow-3", { opacity: 0 }, 0);
      tl.to("#follow-3", { opacity: 1, duration: 0.22 }, 2.9);
      karaoke("#follow-3", 2.95, 2.7);
      window.__timelines = window.__timelines || {};
      window.__timelines["follow"] = tl;
    })();
  </script>
