  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num") return NUM;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.36, Math.max(0.14, (dur - 0.3) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.04 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.1, immediateRender: false }, t + each * 0.65);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.07, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.1, immediateRender: false }, t + each * 0.5);
          }
        });
      };
      const cap = (id, start, dur, last) => {
        if (start > 0) {
          tl.set(id, { opacity: 0 }, 0);
          tl.to(id, { opacity: 1, duration: 0.16 }, start);
        }
        karaoke(id, start, Math.max(0.8, dur - 0.24));
        if (!last) tl.to(id, { opacity: 0, duration: 0.14 }, start + dur - 0.14);
      };
      tl.to("#d1", { opacity: 1, duration: 0.18 }, 0.25);
      tl.to("#m1", { opacity: 1, duration: 0.2 }, 0.4);
      tl.to("#mini", { opacity: 1, duration: 0.2 }, 6.2);
      tl.to("#mini", { opacity: 0, duration: 0.2 }, 11.4);
      tl.to("#d2", { opacity: 1, backgroundColor: "#e7c56a", duration: 0.18 }, 12.15);
      tl.to("#m2", { opacity: 1, duration: 0.2 }, 12.3);
      tl.to("#d3", { opacity: 1, backgroundColor: "#7dcec4", duration: 0.18 }, 17.15);
      tl.to("#m3", { opacity: 1, duration: 0.2 }, 17.3);
      cap("#c29", 0, 6, false);
      cap("#c30", 6, 6, false);
      cap("#c31", 12, 5, false);
      cap("#c32", 17, 6, true);
      window.__timelines = window.__timelines || {};
      window.__timelines["origin"] = tl;
    })();
