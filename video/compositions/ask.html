  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const COST = "#e07a5f";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num") return NUM;
        if (role === "cost") return COST;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.4, Math.max(0.16, (dur - 0.3) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.05 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.12, immediateRender: false }, t + each * 0.7);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.08, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.1, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      tl.fromTo("#jar", { y: 16 }, { y: 0, duration: 0.28, ease: "power2.out" }, 0.15);
      tl.fromTo("#card", { y: 16 }, { y: 0, duration: 0.28, ease: "power2.out" }, 0.35);
      tl.to("#q", { opacity: 1, duration: 0.25 }, 5.15);
      tl.set("#c34", { opacity: 0 }, 0);
      tl.to("#c33", { opacity: 0, duration: 0.14 }, 4.86);
      tl.to("#c34", { opacity: 1, duration: 0.16 }, 5);
      karaoke("#c33", 0, 4.6);
      karaoke("#c34", 5, 5.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["ask"] = tl;
    })();
  </script>
