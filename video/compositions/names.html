  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const COST = "#e07a5f";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num") return NUM;
        if (role === "cost") return COST;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.4, Math.max(0.16, (dur - 0.3) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.05 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.12, immediateRender: false }, t + each * 0.7);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.08, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.1, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      const cap = (id, start, dur, last) => {
        if (start > 0) {
          tl.set(id, { opacity: 0 }, 0);
          tl.to(id, { opacity: 1, duration: 0.16 }, start);
        }
        karaoke(id, start, Math.max(0.8, dur - 0.26));
        if (!last) tl.to(id, { opacity: 0, duration: 0.14 }, start + dur - 0.14);
      };
      tl.to("#lab-p", { opacity: 1, duration: 0.2 }, 0.4);
      tl.to("#lab-pe", { opacity: 1, duration: 0.2 }, 6.15);
      tl.to("#hop", { y: 260, duration: 0.18, ease: "power3.out" }, 11.15);
      tl.to("#lab-c", { opacity: 1, duration: 0.2 }, 11.3);
      tl.to("#lab-ce", { opacity: 1, duration: 0.2 }, 16.2);
      tl.to("#book", { opacity: 1, duration: 0.18 }, 22.15);
      tl.to("#hop", { y: 240, duration: 0.18, ease: "power3.out" }, 22.3);
      tl.to("#book", { x: 80, opacity: 0, duration: 0.28 }, 26.4);
      tl.to("#hop", { y: 530, duration: 0.18, ease: "power3.out" }, 28.15);
      tl.to("#lab-h", { opacity: 1, duration: 0.2 }, 28.3);
      tl.to("#lab-he", { opacity: 1, duration: 0.2 }, 33.15);
      cap("#c18", 0, 6, false);
      cap("#c19", 6, 5, false);
      cap("#c20", 11, 5, false);
      cap("#c21", 16, 6, false);
      cap("#c22", 22, 6, false);
      cap("#c23", 28, 5, false);
      cap("#c24", 33, 5, true);
      window.__timelines = window.__timelines || {};
      window.__timelines["names"] = tl;
