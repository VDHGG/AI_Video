    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num" || role === "gold") return NUM;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.42, Math.max(0.18, (dur - 0.35) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.06 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.14, immediateRender: false }, t + each * 0.7);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.08, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.12, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      const cap = (id, start, dur, last) => {
        if (start > 0) {
          tl.set(id, { opacity: 0 }, 0);
          tl.to(id, { opacity: 1, duration: 0.16 }, start);
        }
        karaoke(id, start, Math.max(0.8, dur - 0.28));
        if (!last) tl.to(id, { opacity: 0, duration: 0.14 }, start + dur - 0.14);
      };
      tl.to("#shade", { rotation: 4, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 12, transformOrigin: "50% 0%" }, 0.2);
      tl.to("#p2", { y: -8, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 8 }, 0.4);
      tl.fromTo("#pencil", { rotation: -8 }, { rotation: 10, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, 2.4);
      tl.to("#sub1", { opacity: 1, duration: 0.18 }, 6.2);
      tl.fromTo("#star", { scale: 1 }, { scale: 1.18, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 8.2);
      tl.to("#star", { x: 315, duration: 0.18, ease: "power3.out" }, 12.1);
      tl.to("#sub2", { opacity: 1, duration: 0.18 }, 12.4);
      tl.to("#star", { x: 630, duration: 0.18, ease: "power3.out" }, 18.1);
      tl.to("#sub3", { opacity: 1, duration: 0.18 }, 18.4);
      tl.fromTo("#sub1", { color: "#1a1410" }, { color: "#e7c56a", duration: 0.16, yoyo: true, repeat: 1 }, 24.3);

      cap("#c2", 6, 6, false);
      cap("#c3", 12, 6, false);
      cap("#c4", 18, 6, false);
      cap("#c5", 24, 6, true);
