  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const COST = "#e07a5f";
      const NUM = "#e7c56a";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "num") return NUM;
        if (role === "cost") return COST;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.4, Math.max(0.16, (dur - 0.3) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.05 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.12, immediateRender: false }, t + each * 0.7);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.08, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.1, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      const cap = (id, start, dur, last) => {
        if (start > 0) {
          tl.set(id, { opacity: 0 }, 0);
          tl.to(id, { opacity: 1, duration: 0.16 }, start);
        }
        karaoke(id, start, Math.max(0.8, dur - 0.26));
        if (!last) tl.to(id, { opacity: 0, duration: 0.14 }, start + dur - 0.14);
      };
      tl.to("#r1", { opacity: 1, duration: 0.16 }, 0.4);
      tl.to("#r2", { opacity: 1, duration: 0.16 }, 1.8);
      tl.to("#r3", { opacity: 1, duration: 0.16 }, 3.2);
      tl.to("#r4", { opacity: 1, duration: 0.16 }, 4.6);
      tl.to("#col-r", { opacity: 1, duration: 0.22 }, 6.15);
      tl.to("#short", { opacity: 1, duration: 0.16 }, 6.4);
      tl.to("#note", { opacity: 1, duration: 0.18 }, 6.55);
      tl.to("#hop", { x: 500, duration: 0.18, ease: "power3.out" }, 6.45);
      tl.to("#law", { opacity: 1, duration: 0.18 }, 11.25);
      tl.fromTo("#zero", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, 16.15);
      tl.to("#src", { opacity: 1, duration: 0.2 }, 16.45);
      tl.to("#hop", { y: 140, duration: 0.18, ease: "power3.out" }, 16.5);
      cap("#c25", 0, 6, false);
      cap("#c26", 6, 5, false);
      cap("#c27", 11, 5, false);
      cap("#c28", 16, 5, true);
      window.__timelines = window.__timelines || {};
      window.__timelines["job"] = tl;
    })();
