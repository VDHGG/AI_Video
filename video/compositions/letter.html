  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const DIM = "#9a9388";
      const CREAM = "#f4f1ea";
      const GO = "#7dcec4";
      const COST = "#e07a5f";
      const tone = (el) => {
        const role = el.getAttribute("data-role");
        if (role === "cost") return COST;
        if (role === "go") return GO;
        return null;
      };
      const karaoke = (sel, start, dur) => {
        const words = Array.from(document.querySelectorAll(sel + " .w"));
        const n = words.length;
        if (!n) return;
        const each = Math.min(0.42, Math.max(0.18, (dur - 0.35) / n));
        words.forEach((el, i) => {
          const stay = tone(el);
          const hot = stay || GO;
          const rest = stay || CREAM;
          const t = start + 0.06 + i * each;
          if (i === 0) {
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.14, immediateRender: false }, t + each * 0.7);
          } else {
            tl.fromTo(el, { color: DIM }, { color: hot, duration: 0.08, immediateRender: false }, t);
            tl.fromTo(el, { color: hot }, { color: rest, duration: 0.12, immediateRender: false }, t + each * 0.55);
          }
        });
      };
      const cap = (id, start, dur, last) => {
        if (start > 0) {
          tl.set(id, { opacity: 0 }, 0);
          tl.to(id, { opacity: 1, duration: 0.16 }, start);
        }
        karaoke(id, start, Math.max(0.8, dur - 0.28));
        if (!last) tl.to(id, { opacity: 0, duration: 0.14 }, start + dur - 0.14);
      };
      tl.set("#slash", { rotation: -18, transformOrigin: "50% 50%", scaleX: 0 }, 0);
      tl.to("#blank", { backgroundColor: "#e07a5f", duration: 0.2 }, 6.15);
      tl.to("#blank-lab", { opacity: 1, duration: 0.18 }, 6.3);
      tl.to("#hop", { y: 28, duration: 0.18, ease: "power3.out" }, 6.4);
      tl.to("#typed", { opacity: 1, duration: 0.18 }, 11.1);
      tl.to("#typed", { opacity: 0, duration: 0.16 }, 14.6);
      tl.fromTo("#law", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, 16.15);
      tl.to("#send", { backgroundColor: "#8a4034", duration: 0.16 }, 16.4);
      tl.to("#slash", { opacity: 1, scaleX: 1, duration: 0.16 }, 16.45);
      tl.to("#hop", { y: 330, duration: 0.18, ease: "power3.out" }, 16.5);
      cap("#c13", 0, 6, false);
      cap("#c14", 6, 5, false);
      cap("#c15", 11, 5, false);
      cap("#c16", 16, 6, false);
      cap("#c17", 22, 5, true);
      window.__timelines = window.__timelines || {};
      window.__timelines["letter"] = tl;
    })();
